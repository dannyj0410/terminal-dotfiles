# ~/.config/starship.toml

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$package\
${custom.devport}\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 1000

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " "

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version )]($style)"
detect_files = ["package.json", ".nvmrc"]

[package]
disabled = true

# Shows the port this ticket's dev server is bound to
[custom.devport]
command = "echo $DEV_PORT"
when = 'test -n "$DEV_PORT"'
format = "[:$output](bold blue) "
shell = ["bash", "--noprofile", "--norc"]

[cmd_duration]
min_time = 2000
format = "[$duration]( dimmed white) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
